name: Publish to npm

on:
  push:
    branches:
      - main
      - develop

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run type-check

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No pending changesets found. Skipping release."
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset version

      - name: Read new version
        if: steps.changesets.outputs.has_changesets == 'true'
        id: version
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit release
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git add package.json pnpm-lock.yaml CHANGELOG.md .changeset
          git commit -m "chore: release v${{ steps.version.outputs.new_version }} [skip ci]"

      - name: Tag version
        if: steps.changesets.outputs.has_changesets == 'true'
        run: git tag v${{ steps.version.outputs.new_version }}

      - name: Push release commit and tag
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git push origin ${{ github.ref_name }}
          git push origin v${{ steps.version.outputs.new_version }}

      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract CHANGELOG for current version
        if: steps.changesets.outputs.has_changesets == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          python - <<'PY' > /tmp/changelog.txt
          import os

          version = os.environ["VERSION"]
          pkg = "hsc-fetch"
          lines = []
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          capture = False
          collected = []
          for line in lines:
              if line.startswith(f"## {version}") or line.startswith(f"## {pkg}@{version}"):
                  capture = True
                  continue
              if capture and line.startswith("## "):
                  break
              if capture:
                  collected.append(line)

          content = "".join(collected).strip() or f"Release {version}"
          print(content)
          with open("/tmp/changelog.txt", "w", encoding="utf-8") as f:
              f.write(content)
          PY
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: Release v${{ steps.version.outputs.new_version }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
